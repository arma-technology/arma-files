name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # setup-java zapisuje cache tylko z ~/.gradle; bez tego test.sh używałby
      # katalogu w repozytorium i każdy przebieg pobierał wszystko od nowa.
      GRADLE_USER_HOME: /home/runner/.gradle
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - run: chmod +x gradlew scripts/test.sh
      - run: scripts/test.sh
